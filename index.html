<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Roll Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eeeeee;margin:0;padding:16px;color:#111}
.calculadora{max-width:620px;margin:10px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 14px rgba(0,0,0,.15)}
h1{text-align:center;font-size:25px;margin:4px 0 5px}
.sub{text-align:center;color:#777;font-size:13px;margin-bottom:24px}
.seccion{font-size:13px;font-weight:800;color:#555;border-bottom:2px solid #222;padding-bottom:7px;margin-top:22px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{margin-top:15px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}
input{width:100%;padding:13px;font-size:19px;border:2px solid #aaa;border-radius:8px;background:#fff}
input:focus{outline:none;border-color:#222}
.unidad{font-size:11px;color:#777;margin-top:3px}
button{width:100%;padding:17px;margin-top:24px;font-size:19px;font-weight:bold;border:none;border-radius:9px;background:#222;color:#fff;cursor:pointer}
button:active{transform:scale(.98)}
.resultado{margin-top:22px;padding:18px;background:#eeeeee;border-radius:11px}
.resultado h2{font-size:15px;margin:0 0 14px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:9px;padding:12px}
.titulo{font-size:11px;font-weight:bold;color:#666}
.numero{font-size:27px;font-weight:bold;margin-top:4px}
.principal{background:#222;color:#fff}
.principal .titulo{color:#bbb}
.principal .numero{font-size:31px}
.nota{margin-top:13px;font-size:12px;color:#666;line-height:1.4}
.error{margin-top:15px;padding:12px;background:#ffe1e1;color:#9b0000;border-radius:8px;font-weight:bold;display:none}
@media(max-width:520px){.grid,.result-grid{grid-template-columns:1fr}.calculadora{padding:18px}body{padding:8px}}
</style>
</head>
<body>

<div class="calculadora">
<h1>LABEL ROLL CALCULATOR</h1>
<div class="sub">Calculadora de producción de rollos</div>

<div class="seccion">Datos del pedido y material</div>
<div class="grid">
  <div class="campo">
    <label for="total">Cantidad total</label>
    <input id="total" type="number" min="1" step="1" placeholder="Ej. 300000">
    <div class="unidad">etiquetas</div>
  </div>
  <div class="campo">
    <label for="avance">Avance</label>
    <input id="avance" type="number" min="0" step="0.01" placeholder="Ej. 100">
    <div class="unidad">mm / etiqueta</div>
  </div>
  <div class="campo">
    <label for="separacion">Separación</label>
    <input id="separacion" type="number" min="0" step="0.01" placeholder="Ej. 1.60">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="espesor">Espesor</label>
    <input id="espesor" type="number" min="0" step="0.00001" placeholder="Ej. 0.11521">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="mandril">Ø mandril</label>
    <input id="mandril" type="number" min="0" step="0.01" placeholder="Ej. 84">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="diamMax">Ø máximo</label>
    <input id="diamMax" type="number" min="0" step="0.01" placeholder="Ej. 150">
    <div class="unidad">mm</div>
  </div>
</div>

<div class="seccion">Embalaje</div>
<div class="grid">
  <div class="campo">
    <label for="cajaL">Caja largo</label>
    <input id="cajaL" type="number" min="0" step="0.01" placeholder="Ej. 400">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="cajaA">Caja ancho</label>
    <input id="cajaA" type="number" min="0" step="0.01" placeholder="Ej. 300">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="cajaH">Caja alto</label>
    <input id="cajaH" type="number" min="0" step="0.01" placeholder="Ej. 300">
    <div class="unidad">mm</div>
  </div>
  <div class="campo">
    <label for="anchoRollo">Ancho del rollo</label>
    <input id="anchoRollo" type="number" min="0" step="0.01" placeholder="Ej. 45">
    <div class="unidad">mm</div>
  </div>
</div>

<button onclick="calcular()">CALCULAR</button>
<div id="error" class="error"></div>

<div class="resultado">
<h2>RESULTADOS</h2>
<div class="result-grid">
  <div class="card principal"><div class="titulo">ETIQUETAS / ROLLO</div><div id="rEtiquetas" class="numero">—</div></div>
  <div class="card principal"><div class="titulo">Nº DE ROLLOS</div><div id="rRollos" class="numero">—</div></div>
  <div class="card"><div class="titulo">Ø FINAL REAL</div><div id="rDiametro" class="numero">—</div></div>
  <div class="card"><div class="titulo">METROS / ROLLO</div><div id="rMetros" class="numero">—</div></div>
  <div class="card"><div class="titulo">MÁX. ETIQUETAS POR Ø</div><div id="rMax" class="numero">—</div></div>
  <div class="card"><div class="titulo">ROLLOS / CAJA</div><div id="rCaja" class="numero">—</div></div>
  <div class="card"><div class="titulo">Nº DE CAJAS</div><div id="rCajas" class="numero">—</div></div>
  <div class="card"><div class="titulo">ETIQUETAS PRODUCIDAS</div><div id="rProducidas" class="numero">—</div></div>
</div>
<div id="nota" class="nota"></div>
</div>
</div>

<script>
function n(id){ return Number(document.getElementById(id).value); }
function fmt(x,dec=2){ return Number(x).toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmt0(x){ return Math.round(x).toLocaleString("es-ES"); }

/* Equivalente a:
   MAX(FILTER(SEQUENCE(total),(MOD(total,SEQUENCE(total))=0)*(SEQUENCE(total)<=INT(maximo))))
*/
function mayorDivisor(total,maximo){
  let mejor=1;
  for(let i=1;i*i<=total;i++){
    if(total%i===0){
      const d1=i, d2=total/i;
      if(d1<=maximo && d1>mejor) mejor=d1;
      if(d2<=maximo && d2>mejor) mejor=d2;
    }
  }
  return mejor;
}

function calcular(){
  const error=document.getElementById("error");
  error.style.display="none";

  const total=n("total"), Av=n("avance"), S=n("separacion");
  const e=n("espesor"), Di=n("mandril"), Dmax=n("diamMax");
  const L=n("cajaL"), A=n("cajaA"), H=n("cajaH"), Ar=n("anchoRollo");

  if([total,Av,S,e,Di,Dmax].some(x=>!Number.isFinite(x)||x<=0)){
    error.textContent="Completa todos los datos de producción con valores mayores que cero.";
    error.style.display="block"; return;
  }
  if(Dmax<=Di){
    error.textContent="El diámetro máximo debe ser mayor que el diámetro del mandril.";
    error.style.display="block"; return;
  }

  /* Excel C15:
     PI()*(Df^2-Di^2)/(4*(Av+S)*e)
     Aquí Df = diámetro máximo permitido.
  */
  const maxFisico=Math.floor(Math.PI*(Dmax**2-Di**2)/(4*(Av+S)*e));

  if(maxFisico<1){
    error.textContent="Con estos parámetros no cabe ni una etiqueta dentro del diámetro máximo.";
    error.style.display="block"; return;
  }

  const limite=Math.min(total,maxFisico);
  const etiquetas=mayorDivisor(total,limite);
  const rollos=total/etiquetas;

  /* Excel C8:
     SQRT(Di^2+(4*N*(Av+S)*e/PI()))
  */
  const Df=Math.sqrt(Di**2+(4*etiquetas*(Av+S)*e/Math.PI));

  /* Excel Q6:
     SUM(Av+S)*N/1000
  */
  const metros=(Av+S)*etiquetas/1000;

  let rollosCaja="—", cajas="—";
  if(L>0 && A>0 && H>0 && Ar>0){
    /* Equivalente a:
       INT(L/Df)*INT(A/Df)*INT(H/Ar)
       El rollo se considera tumbado, usando dos diámetros y el ancho.
    */
    rollosCaja=Math.floor(L/Df)*Math.floor(A/Df)*Math.floor(H/Ar);
    cajas=rollosCaja>0 ? Math.ceil(rollos/rollosCaja) : "—";
  }

  document.getElementById("rEtiquetas").textContent=fmt0(etiquetas);
  document.getElementById("rRollos").textContent=fmt0(rollos);
  document.getElementById("rDiametro").textContent=fmt(Df,2)+" mm";
  document.getElementById("rMetros").textContent=fmt(metros,2)+" m";
  document.getElementById("rMax").textContent=fmt0(maxFisico);
  document.getElementById("rCaja").textContent=typeof rollosCaja==="number" ? fmt0(rollosCaja) : rollosCaja;
  document.getElementById("rCajas").textContent=typeof cajas==="number" ? fmt0(cajas) : cajas;
  document.getElementById("rProducidas").textContent=fmt0(etiquetas*rollos);

  let texto="Selección automática: mayor divisor de la cantidad total que no supera el máximo físico permitido por el diámetro.";
  if(rollosCaja===0) texto+=" Con las dimensiones indicadas no cabe ningún rollo en la caja.";
  document.getElementById("nota").textContent=texto;
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
